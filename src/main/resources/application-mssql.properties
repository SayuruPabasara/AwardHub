# =============================
# Microsoft SQL Server — the official, university-mandated target.
# This is what CI / grading / deployment should run against.
#
# Runs on Windows natively, and on Mac (Intel or Apple Silicon) via the
# official Docker image:
#   docker run -e "ACCEPT_EULA=1" -e "MSSQL_SA_PASSWORD=Your_str0ng_Pwd" \
#     -p 1433:1433 --name awardhub-mssql -d mcr.microsoft.com/mssql/server:2022-latest
# On Apple Silicon, first enable Docker Desktop's
# Settings -> General -> "Use Rosetta for x86_64/amd64 emulation on Apple Silicon" —
# the image isn't natively ARM64, but runs fine under that emulation for dev.
# =============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=awardhub2;encrypt=true;trustServerCertificate=true
spring.datasource.username=awardhub2_user
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
