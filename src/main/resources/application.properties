server.port=8080
spring.application.name=awardhub

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3307/awardhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sarfi2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson ISO DateTime formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.awardhub=INFO
