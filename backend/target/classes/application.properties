# =============================================================================
# AwardHub - Integrated Spring Boot Application Configuration
# Target Database: Real MySQL Server (localhost:3306)
# =============================================================================

server.port=8080
spring.application.name=awardhub

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/awardhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson DateTime formatting (ISO 8601 strings)
spring.jackson.serialization.write-dates-as-timestamps=false

# Security / JWT
app.jwt.secret=${JWT_SECRET:AwardHubSecureTokenSigningKey2026OrganizerSecretKey!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS configuration for frontend development
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# File Upload Configuration
app.upload.nominee-documents-dir=uploads/nominee-documents

# Logging
logging.level.com.awardhub=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
